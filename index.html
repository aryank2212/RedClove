<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Primary SEO meta tags -->
    <title>RedClove Academy — Defense, Intelligence &amp; Cyber Operations Training</title>
    <meta
      name="description"
      content="RedClove Academy trains operators, analysts and engineers in defense systems, intelligence tradecraft and cyber operations. Making the world a better place."
    />
    <meta
      name="keywords"
      content="defense training, intelligence systems, cyber operations, RedClove, security courses, threat analysis"
    />
    <meta name="author" content="RedClove" />
    <link rel="canonical" href="https://academy.redclove.example/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RedClove Academy — Defense, Intelligence &amp; Cyber Operations Training" />
    <meta
      property="og:description"
      content="Hands-on training in defense systems, intelligence tradecraft and cyber operations. -Making the world a better place."
    />
    <meta property="og:image" content="https://picsum.photos/seed/redclove-og/1200/630" />
    <meta property="og:url" content="https://academy.redclove.example/" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RedClove Academy" />
    <meta name="twitter:description" content="Defense, intelligence and cyber operations training." />
    <meta name="twitter:image" content="https://picsum.photos/seed/redclove-og/1200/630" />

    <!-- Preconnect to image CDN for faster placeholder loads -->
    <link rel="preconnect" href="https://picsum.photos" crossorigin />

    <!-- JetBrains Mono — monospace face that anchors the terminal aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data for richer search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "RedClove Academy",
        "slogan": "-Making the world a better place.",
        "url": "https://academy.redclove.example/",
        "description": "Training in defense systems, intelligence tradecraft and cyber operations."
      }
    </script>
  </head>
  <body>
    <!-- React mounts here -->
    <div id="root"></div>
    <noscript>RedClove Academy requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
